<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>猜猜TA是谁 · 科技风</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Noto+Sans+SC:wght@300;400;700&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #000000;
      --surface: #0A0A0A;
      --surface-light: #141414;
      --border: #1F1F1F;
      --fg: #EDEDED;
      --muted: #666;
      --accent: #00FF88;
      --accent-dim: rgba(0,255,136,0.15);
      --accent-glow: rgba(0,255,136,0.4);
      --danger: #FF3B3B;
      --warn: #FFB800;
      --cyan: #00D4FF;
      --mono: 'JetBrains Mono', monospace;
      --sans: 'Noto Sans SC', -apple-system, sans-serif;
      --radius: 2px;
    }
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--fg);
      max-width: 420px;
      margin: 0 auto;
      min-height: 100vh;
      padding: 0 20px;
      position: relative;
    }
    body::before {
      content: ''; position: fixed; inset: 0;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 2px, rgba(0,255,136,0.015) 2px, rgba(0,255,136,0.015) 4px
      );
      pointer-events: none; z-index: 1000;
    }

    /* Home */
    .home-screen {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 100vh; text-align: center;
    }
    .home-logo {
      font-family: var(--mono); font-size: 14px; color: var(--accent);
      letter-spacing: 4px; text-transform: uppercase; margin-bottom: 8px;
    }
    .home-title {
      font-size: 40px; font-weight: 700; margin-bottom: 4px;
      font-family: var(--sans);
    }
    .home-sub {
      font-family: var(--mono); font-size: 12px; color: var(--muted);
      margin-bottom: 48px; letter-spacing: 2px;
    }
    .mode-list { display: flex; flex-direction: column; gap: 2px; width: 100%; }
    .mode-row {
      display: flex; align-items: center; gap: 16px;
      padding: 18px 20px; cursor: pointer;
      background: var(--surface); border: 1px solid var(--border);
      transition: all 0.2s;
    }
    .mode-row:hover {
      background: var(--surface-light);
      border-color: var(--accent);
      box-shadow: inset 0 0 30px var(--accent-dim);
    }
    .mode-row:first-child { border-radius: var(--radius) var(--radius) 0 0; }
    .mode-row:last-child { border-radius: 0 0 var(--radius) var(--radius); }
    .mode-icon { font-size: 20px; width: 32px; text-align: center; }
    .mode-info { flex: 1; text-align: left; }
    .mode-name { font-size: 15px; font-weight: 700; }
    .mode-desc { font-size: 12px; color: var(--muted); font-family: var(--mono); }
    .mode-status {
      font-family: var(--mono); font-size: 10px; padding: 3px 10px;
      border: 1px solid var(--accent); color: var(--accent);
      letter-spacing: 1px;
    }
    .mode-status.soon { border-color: var(--muted); color: var(--muted); }

    /* Game */
    .game-screen { display: none; flex-direction: column; min-height: 100vh; padding-top: 16px; }
    .game-screen.active { display: flex; }
    .home-screen.hidden { display: none; }

    .sys-bar {
      display: flex; justify-content: space-between; align-items: center;
      font-family: var(--mono); font-size: 11px; color: var(--muted);
      padding-bottom: 12px; border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }
    .sys-bar .live { color: var(--accent); }
    .sys-bar .live::before {
      content: ''; display: inline-block; width: 6px; height: 6px;
      background: var(--accent); border-radius: 50%; margin-right: 6px;
      animation: blink 1.5s infinite;
    }

    /* Terminal-style progress */
    .terminal-track {
      font-family: var(--mono); font-size: 11px;
      color: var(--muted); margin-bottom: 20px;
      display: flex; gap: 2px;
    }
    .t-block {
      width: 100%; height: 3px;
      background: var(--border); transition: all 0.3s;
    }
    .t-block.done { background: var(--accent); }
    .t-block.now { background: var(--accent); animation: blink 1s infinite; }

    /* Clue - terminal style */
    .clue-terminal {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 20px;
      margin-bottom: 20px;
      font-family: var(--mono);
      position: relative;
    }
    .clue-terminal::before {
      content: 'CLUE_' attr(data-clue);
      position: absolute; top: -8px; left: 12px;
      background: var(--bg); padding: 0 6px;
      font-size: 9px; color: var(--accent);
      letter-spacing: 2px;
    }
    .clue-prompt { font-size: 11px; color: var(--accent); margin-bottom: 8px; }
    .clue-text {
      font-family: var(--sans); font-size: 17px; font-weight: 300;
      line-height: 1.7; color: var(--fg);
    }
    .clue-cursor {
      display: inline-block; width: 2px; height: 17px;
      background: var(--accent); animation: blink 1s step-end infinite;
      vertical-align: text-bottom; margin-left: 2px;
    }

    /* Scan line */
    .scan-line {
      height: 1px; background: linear-gradient(90deg, transparent, var(--accent), transparent);
      margin: 16px 0; opacity: 0.3;
      animation: scan 3s linear infinite;
    }

    /* Temp */
    .temp-readout {
      display: flex; align-items: center; gap: 12px;
      font-family: var(--mono); font-size: 12px;
      padding: 10px 16px; border: 1px solid var(--border);
      margin-bottom: 16px; display: none;
    }
    .temp-bar-inner {
      flex: 1; height: 4px; background: var(--border);
      position: relative; overflow: hidden;
    }
    .temp-bar-fill {
      height: 100%; transition: width 0.5s ease, background 0.3s;
    }

    /* Input */
    .input-zone { margin-top: auto; padding-bottom: 28px; }
    .input-terminal {
      display: flex; align-items: center; gap: 8px;
      border: 1px solid var(--border); padding: 2px;
      background: var(--surface);
    }
    .input-prefix {
      font-family: var(--mono); font-size: 12px;
      color: var(--accent); padding: 12px 10px; white-space: nowrap;
    }
    .guess-input {
      flex: 1; padding: 14px 0; background: none; border: none;
      font-family: var(--sans); font-size: 16px; color: var(--fg);
      outline: none;
    }
    .guess-input::placeholder { color: #333; }
    .enter-btn {
      padding: 14px 20px; background: var(--accent); color: #000;
      border: none; font-family: var(--mono); font-size: 12px;
      font-weight: 700; cursor: pointer; letter-spacing: 1px;
      transition: opacity 0.15s;
    }
    .enter-btn:hover { opacity: 0.85; }
    .cmd-row {
      display: flex; justify-content: space-between;
      margin-top: 10px;
      font-family: var(--mono); font-size: 11px; color: #444;
    }
    .cmd-row span { cursor: pointer; }
    .cmd-row span:hover { color: var(--accent); }

    /* Feedback */
    .terminal-msg {
      font-family: var(--mono); font-size: 12px;
      padding: 10px 16px; margin-bottom: 12px;
      border-left: 2px solid; display: none;
    }
    .terminal-msg.err { border-color: var(--danger); color: var(--danger); background: rgba(255,59,59,0.05); }
    .terminal-msg.ok { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
    .terminal-msg.show { display: block; animation: typeIn 0.3s steps(20); }

    /* Result */
    .result-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.97); z-index: 100;
      flex-direction: column; align-items: center;
      justify-content: center; text-align: center; padding: 40px;
    }
    .result-overlay.show { display: flex; }
    .result-icon {
      font-size: 11px; font-family: var(--mono);
      color: var(--accent); letter-spacing: 4px; margin-bottom: 20px;
    }
    .result-emoji { font-size: 56px; margin-bottom: 16px; }
    .result-title { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
    .result-name {
      font-family: var(--mono); font-size: 14px; color: var(--muted);
      margin-bottom: 32px;
    }
    .result-box {
      border: 1px solid var(--border); padding: 28px 48px;
      margin-bottom: 36px;
    }
    .result-num {
      font-family: var(--mono); font-size: 52px; font-weight: 700;
      color: var(--accent);
      text-shadow: 0 0 40px var(--accent-glow);
    }
    .result-stars { font-size: 24px; margin: 8px 0; }
    .result-meta {
      font-family: var(--mono); font-size: 11px; color: #444;
      letter-spacing: 1px;
    }
    .restart-btn {
      padding: 14px 48px; background: none;
      border: 1px solid var(--accent); color: var(--accent);
      font-family: var(--mono); font-size: 13px; cursor: pointer;
      letter-spacing: 2px; transition: all 0.2s;
    }
    .restart-btn:hover {
      background: var(--accent); color: #000;
      box-shadow: 0 0 30px var(--accent-dim);
    }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    @keyframes scan { 0%{transform:translateX(-100%)} 100%{transform:translateX(100%)} }
    @keyframes typeIn { from{opacity:0} to{opacity:1} }
    .shake { animation: shake 0.3s ease; }
    @keyframes shake {
      0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)}
    }
  </style>
</head>
<body>

<!-- Home -->
<div class="home-screen" id="homeScreen">
  <div class="home-logo">[ SYSTEM ]</div>
  <div class="home-title">猜猜TA是谁</div>
  <div class="home-sub">IDENTITY RECOGNITION PROTOCOL v1.0</div>
  <div class="mode-list">
    <div class="mode-row" onclick="startGame()">
      <div class="mode-icon">🔦</div>
      <div class="mode-info">
        <div class="mode-name">渐进揭秘</div>
        <div class="mode-desc">progressive_reveal.exe</div>
      </div>
      <div class="mode-status">READY</div>
    </div>
    <div class="mode-row" onclick="void(0)">
      <div class="mode-icon">❓</div>
      <div class="mode-info">
        <div class="mode-name">二十问</div>
        <div class="mode-desc">twenty_questions.exe</div>
      </div>
      <div class="mode-status soon">LOCKED</div>
    </div>
    <div class="mode-row" onclick="void(0)">
      <div class="mode-icon">🤝</div>
      <div class="mode-info">
        <div class="mode-name">描述接龙</div>
        <div class="mode-desc">description_chain.exe</div>
      </div>
      <div class="mode-status soon">LOCKED</div>
    </div>
  </div>
</div>

<!-- Game -->
<div class="game-screen" id="gameScreen">
  <div class="sys-bar">
    <span class="live">LIVE</span>
    <span>SCORE: <span id="scoreNum" style="color:var(--accent)">0000</span></span>
    <span>STREAK: <span id="streakNum">0</span></span>
  </div>

  <div class="terminal-track" id="track"></div>

  <div class="clue-terminal" id="clueTerm" data-clue="01">
    <div class="clue-prompt" id="cluePrompt">$ cat clue_01.txt</div>
    <div class="clue-text"><span id="clueText"></span><span class="clue-cursor"></span></div>
  </div>

  <div class="scan-line"></div>

  <div class="terminal-msg" id="termMsg"></div>

  <div class="temp-readout" id="tempReadout">
    <span style="color:var(--muted)">PROXIMITY:</span>
    <div class="temp-bar-inner">
      <div class="temp-bar-fill" id="tempFill" style="width:0%"></div>
    </div>
    <span id="tempLabel" style="color:var(--muted)">---</span>
  </div>

  <div class="input-zone">
    <div class="input-terminal">
      <span class="input-prefix">&gt; guess:</span>
      <input type="text" class="guess-input" id="guessInput" placeholder="输入身份..." autocomplete="off">
      <button class="enter-btn" onclick="submitGuess()">ENTER</button>
    </div>
    <div class="cmd-row">
      <span onclick="nextClue()">[SPACE] 下一条线索</span>
      <span id="clueCounter">CLUE 1/8</span>
    </div>
  </div>
</div>

<!-- Result -->
<div class="result-overlay" id="resultOverlay">
  <div class="result-icon">// ANALYSIS COMPLETE</div>
  <div class="result-emoji" id="resultEmoji">✅</div>
  <div class="result-title" id="resultTitle">IDENTITY CONFIRMED</div>
  <div class="result-name" id="resultName"></div>
  <div class="result-box">
    <div class="result-num" id="resultScore">0</div>
    <div class="result-stars" id="resultStars"></div>
    <div class="result-meta" id="resultMeta"></div>
  </div>
  <button class="restart-btn" onclick="resetGame()">[ NEW SESSION ]</button>
</div>

<script>
const questions = [
  { name:"诸葛亮", aliases:["孔明","卧龙","诸葛孔明"],
    clues:["这是一位中国古代的政治家","他活跃在东汉末年到三国时期","他是一位著名的军事谋略家","他被三顾茅庐请出山","他的标志性形象是手持羽扇、头戴纶巾","他写了一篇著名的出师表","他的名字中有一个"亮"字","他的姓氏是一个复姓"] },
  { name:"灭霸", aliases:["Thanos","萨诺斯","紫薯"],
    clues:["这是一个虚构角色","他来自一部超级英雄电影","他是漫威宇宙的角色","他是一个反派，但自认为在拯救宇宙","他戴着一只金色手套，上面有六颗宝石","他打了一个响指，消灭了一半生命","他的皮肤是紫色的","他的名字在希腊语中意为"死亡""] },
  { name:"周杰伦", aliases:["Jay Chou","杰伦","周董","小公举"],
    clues:["这是一位华语音乐人","他来自中国台湾","他被称为"亚洲流行天王"","他的音乐风格融合了中国风和R&B","他有一首歌叫《青花瓷》","他的口头禅是"哎呦不错哦"","他娶了一位模特叫昆凌","他的姓氏是一个朝代名"] }
];

let cur, idx, score, streak;
const mult = [8,7,6,5,4,3,2,1];

function startGame() {
  document.getElementById('homeScreen').classList.add('hidden');
  const g = document.getElementById('gameScreen');
  g.classList.add('active'); g.style.display = 'flex';
  cur = questions[Math.floor(Math.random()*questions.length)];
  idx=0; score=0; streak=0; render();
}

function render() {
  // track
  const t = document.getElementById('track');
  t.innerHTML = '';
  for (let i=0;i<8;i++) {
    const d = document.createElement('div');
    d.className = 't-block'+(i<idx?' done':'')+(i===idx?' now':'');
    t.appendChild(d);
  }
  // clue
  const ct = document.getElementById('clueTerm');
  ct.setAttribute('data-clue', String(idx+1).padStart(2,'0'));
  document.getElementById('cluePrompt').textContent = `$ cat clue_${String(idx+1).padStart(2,'0')}.txt`;
  document.getElementById('clueText').textContent = cur.clues[idx];
  document.getElementById('clueCounter').textContent = `CLUE ${idx+1}/8`;
  document.getElementById('scoreNum').textContent = String(Math.round(score)).padStart(4,'0');
  document.getElementById('streakNum').textContent = streak;
  document.getElementById('guessInput').value = '';
}

function nextClue() {
  if (idx>=7) return;
  idx++; render();
  hideMsg(); hideTemp();
}

function submitGuess() {
  const v = document.getElementById('guessInput').value.trim();
  if (!v) return;
  const n = v.toLowerCase().replace(/\s/g,'');
  const ok = n===cur.name.toLowerCase().replace(/\s/g,'') ||
    cur.aliases.some(a=>n===a.toLowerCase().replace(/\s/g,''));

  if (ok) {
    const pts = Math.round(100*mult[idx]*1.5);
    score += pts; streak++;
    showMsg('ok', `> MATCH FOUND: "${cur.name}" | +${pts} PTS`);
    setTimeout(()=>showResult(true), 900);
  } else {
    streak=0;
    document.getElementById('clueTerm').classList.add('shake');
    setTimeout(()=>document.getElementById('clueTerm').classList.remove('shake'),300);
    showMsg('err', `> NO MATCH: "${v}" | TRY AGAIN`);
    showTemp();
    if (idx<7) nextClue(); else showResult(false);
  }
  document.getElementById('scoreNum').textContent = String(Math.round(score)).padStart(4,'0');
  document.getElementById('streakNum').textContent = streak;
}

function showMsg(cls, txt) {
  const m = document.getElementById('termMsg');
  m.className = 'terminal-msg show ' + cls;
  m.textContent = txt;
}
function hideMsg() { document.getElementById('termMsg').classList.remove('show'); }

function showTemp() {
  const r = document.getElementById('tempReadout');
  r.style.display = 'flex';
  const pct = Math.min(100, (idx+1)/8*100);
  const fill = document.getElementById('tempFill');
  fill.style.width = pct + '%';
  fill.style.background = pct > 75 ? 'var(--danger)' : pct > 50 ? 'var(--warn)' : 'var(--cyan)';
  const labels = ['COLD','COOL','WARM','HOT','!!!'];
  document.getElementById('tempLabel').textContent = labels[Math.min(idx,4)];
  document.getElementById('tempLabel').style.color =
    pct > 75 ? 'var(--danger)' : pct > 50 ? 'var(--warn)' : 'var(--cyan)';
}
function hideTemp() { document.getElementById('tempReadout').style.display = 'none'; }

function showResult(ok) {
  const o = document.getElementById('resultOverlay');
  o.classList.add('show');
  document.getElementById('resultEmoji').textContent = ok ? '✅' : '❌';
  document.getElementById('resultTitle').textContent = ok ? 'IDENTITY CONFIRMED' : 'IDENTITY UNKNOWN';
  document.getElementById('resultName').textContent = `TARGET: ${cur.name}`;
  if (!ok) score = 50;
  document.getElementById('resultScore').textContent = String(Math.round(score)).padStart(4,'0');
  const stars = ok ? Math.max(1,5-idx) : 1;
  document.getElementById('resultStars').textContent = '⭐'.repeat(stars);
  document.getElementById('resultMeta').textContent =
    `RESOLVED_AT_CLUE_${idx+1} | DIFFICULTY_x1.5 | STREAK_${streak||1}`;
}

function resetGame() {
  document.getElementById('resultOverlay').classList.remove('show');
  hideTemp(); hideMsg();
  cur = questions[Math.floor(Math.random()*questions.length)];
  idx=0;score=0;streak=0; render();
}

document.getElementById('guessInput').addEventListener('keydown', e => {
  if (e.key==='Enter') submitGuess();
  if (e.key===' ') { e.preventDefault(); nextClue(); }
});
</script>
</body>
</html>
